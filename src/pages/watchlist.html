<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync – Watchlist</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/globals.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family:'Inter',sans-serif; background:#0d0d0d; color:#fff; }
        .font-serif { font-family:'Playfair Display',serif; }
        ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-track{background:#121212}
        ::-webkit-scrollbar-thumb{background:#333;border-radius:4px} ::-webkit-scrollbar-thumb:hover{background:#555}
        .hide-scrollbar::-webkit-scrollbar{display:none} .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        .clip-grad-1 {background:linear-gradient(160deg,#3a2a1a,#c8922a)}
        .clip-grad-2 {background:linear-gradient(160deg,#1a2a3a,#2a8ac8)}
        .clip-grad-3 {background:linear-gradient(160deg,#2a1a3a,#8a2ac8)}
        .clip-grad-4 {background:linear-gradient(160deg,#1a3a2a,#2ac88a)}
        .clip-grad-5 {background:linear-gradient(160deg,#3a1a2a,#c82a6a)}
        .watch-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 220px)); gap:24px; }
        .watch-poster { aspect-ratio:2/3; }
        .filter-btn.active { background:#eab308; color:#000; border-color:#eab308; }
    </style>
</head>
<body class="flex h-screen overflow-hidden dark">

<!-- SIDEBAR -->
<aside id="sidebar-container" class="bg-[#141414] border-r border-[#2a2a2a] flex flex-col h-full flex-shrink-0 z-20" style="width:240px;"></aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col h-full overflow-hidden">
    <div id="header-container" class="z-10 flex-shrink-0 w-full"></div>

    <div class="flex-1 overflow-y-auto p-8" id="mainScrollContainer">

        <div class="content-transition fade-in-up mb-8">
            <p class="mb-2 uppercase text-xs font-semibold tracking-widest text-gray-500">Pick up where you left off</p>
            <h2 class="text-4xl font-serif mb-3">Your <span class="text-yellow-500 italic">watchlist.</span></h2>
            <p class="text-sm text-gray-400 max-w-xl">Everything you've saved to watch later, sorted by how far along you are.</p>
        </div>

        <div class="content-transition fade-in-up flex flex-wrap gap-3 mb-8" id="filterBar">
            <button data-status="all" class="filter-btn active flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#1a1a1a] border border-[#333] hover:border-yellow-500/50 transition-colors text-sm font-medium">
                All <span class="filter-count text-xs opacity-70" data-count="all">0</span>
            </button>
            <button data-status="planned" class="filter-btn flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#1a1a1a] border border-[#333] hover:border-yellow-500/50 transition-colors text-sm font-medium">
                <i class="fa-regular fa-bookmark text-blue-400"></i> Planned <span class="filter-count text-xs opacity-70" data-count="planned">0</span>
            </button>
            <button data-status="watching" class="filter-btn flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#1a1a1a] border border-[#333] hover:border-yellow-500/50 transition-colors text-sm font-medium">
                <i class="fa-solid fa-play text-yellow-500"></i> Watching <span class="filter-count text-xs opacity-70" data-count="watching">0</span>
            </button>
            <button data-status="watched" class="filter-btn flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#1a1a1a] border border-[#333] hover:border-yellow-500/50 transition-colors text-sm font-medium">
                <i class="fa-solid fa-check text-green-400"></i> Watched <span class="filter-count text-xs opacity-70" data-count="watched">0</span>
            </button>
        </div>

        <div class="content-transition fade-in-up watch-grid" id="watchlistGrid"></div>

        <div id="emptyState" class="hidden text-center text-gray-500 py-20">
            <i class="fa-regular fa-folder-open text-3xl mb-4 block"></i>
            <p class="text-sm">Nothing here yet — head to <a href="discover.html" class="text-yellow-500 hover:text-yellow-400 transition-colors font-semibold">Discover</a> to add something to your watchlist.</p>
        </div>
    </div>
</main>

<script type="module" src="../js/pages/watchlist.js"></script>
</body>
</html>
