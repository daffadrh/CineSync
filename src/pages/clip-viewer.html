<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync – Clip</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode:'class' }</script>
    <style>
        :root {
            --viewer-height: min(80dvh, 800px);
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family:'Inter',sans-serif; background:#0d0d0d; color:#fff; }
        .font-serif { font-family:'Playfair Display',serif; }
        ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-track{background:#121212}
        ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
        .hide-scrollbar::-webkit-scrollbar{display:none} .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        .clip-grad-1 {background:linear-gradient(160deg,#3a2a1a,#c8922a)}
        .clip-grad-2 {background:linear-gradient(160deg,#1a2a3a,#2a8ac8)}
        .clip-grad-3 {background:linear-gradient(160deg,#2a1a3a,#8a2ac8)}
        .clip-grad-4 {background:linear-gradient(160deg,#1a3a2a,#2ac88a)}
        .clip-grad-5 {background:linear-gradient(160deg,#3a1a2a,#c82a6a)}
        .clip-grad-6 {background:linear-gradient(160deg,#2a2a1a,#c8c02a)}
        .clip-grad-7 {background:linear-gradient(160deg,#1a3a3a,#2ac8c0)}
        .clip-grad-8 {background:linear-gradient(160deg,#3a2a2a,#c84a2a)}
        .clip-grad-9 {background:linear-gradient(160deg,#2a1a1a,#c8402a)}
        .clip-grad-10{background:linear-gradient(160deg,#1a2a1a,#4ac82a)}
        #sidePanel   { transition:width .3s ease, opacity .3s ease, padding .3s ease; height: var(--viewer-height); border-radius: 20px; }
        #clipMain    { height: var(--viewer-height); aspect-ratio: 9 / 16; border-radius: 20px; }
        .action-icon { transition:background .2s, border-color .2s, color .2s; }
        #savedToast  { transition:opacity .3s ease, transform .3s ease; }
        #shareOverlay{ transition:opacity .2s ease; }
        .strip-hint  { transition:opacity .2s; }
        .strip-hint:hover { opacity:0.75 !important; }

        /* Comments Panel Layout */
        .comments-panel { height: 100%; display: flex; flex-direction: column; }
        .comments-header { flex-shrink: 0; padding: 24px 28px; border-bottom: 1px solid #2a2a2a; background: #141414; }
        .comments-list { flex: 1; overflow-y: auto; padding: 20px 28px; }
        .comments-input { flex-shrink: 0; padding: 16px 28px 24px; border-top: 1px solid #2a2a2a; background: #141414; }
    </style>
</head>
<body class="flex h-screen overflow-hidden dark">

<!-- SIDEBAR -->
<aside id="sidebar-container" class="bg-[#141414] border-r border-[#2a2a2a] flex flex-col h-full flex-shrink-0 z-20" style="width:240px;"></aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col h-full overflow-hidden">
    <!-- Header -->
    <div id="header-container" class="z-10 flex-shrink-0 w-full"></div>

    <!-- Viewer stage -->
    <div class="flex-1 flex items-center justify-center overflow-hidden px-8 py-6">
        
        <div id="viewerShell" class="relative flex items-center justify-center gap-3">
            <!-- Side panel -->
            <aside id="sidePanel"
                   class="hide-scrollbar overflow-y-auto overflow-x-hidden flex-shrink-0 bg-[#141414]"
                   style="width:0;opacity:0;"></aside>

            <!-- Clip card -->
            <div id="clipMain" class="relative flex flex-col flex-shrink-0 overflow-hidden bg-black">
                <div id="clipThumb" class="absolute inset-0 w-full h-full clip-grad-6"></div>
                <div id="clipCaptionOverlay" class="absolute bottom-0 left-0 right-0 z-10 p-5 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
            </div>

            <!-- Action rail -->
            <div class="flex flex-col justify-center gap-0.5 flex-shrink-0 bg-[#0d0d0d] rounded-[20px] px-3"
                 id="actionRail" style="height: var(--viewer-height);">

                <button data-action="info" class="action-btn flex flex-col items-center gap-1.5 px-3 py-3 rounded-3xl hover:bg-white/5 transition-colors cursor-pointer bg-transparent border-none text-white">
                    <span class="action-icon w-[50px] h-[50px] rounded-full bg-white/[.07] border border-white/10 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-circle-info pointer-events-none"></i>
                    </span>
                    <span class="text-[11px] font-medium text-gray-400">Info</span>
                </button>

            <button data-action="comments" class="action-btn flex flex-col items-center gap-1.5 px-3 py-3 rounded-3xl hover:bg-white/5 transition-colors cursor-pointer bg-transparent border-none text-white">
                <span class="action-icon w-[50px] h-[50px] rounded-full bg-white/[.07] border border-white/10 flex items-center justify-center text-lg">
                    <i class="fa-regular fa-comment pointer-events-none"></i>
                </span>
                <span id="commentCount" class="text-[11px] font-medium text-gray-400">0</span>
            </button>

            <button data-action="share" class="action-btn flex flex-col items-center gap-1.5 px-3 py-3 rounded-3xl hover:bg-white/5 transition-colors cursor-pointer bg-transparent border-none text-white">
                <span class="action-icon w-[50px] h-[50px] rounded-full bg-white/[.07] border border-white/10 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-share-nodes pointer-events-none"></i>
                </span>
                <span class="text-[11px] font-medium text-gray-400">Share</span>
            </button>

            <button data-action="save" class="action-btn flex flex-col items-center gap-1.5 px-3 py-3 rounded-3xl hover:bg-white/5 transition-colors cursor-pointer bg-transparent border-none text-white">
                <span class="action-icon w-[50px] h-[50px] rounded-full bg-white/[.07] border border-white/10 flex items-center justify-center text-lg">
                    <i id="saveIcon" class="fa-regular fa-bookmark pointer-events-none"></i>
                </span>
                <span class="text-[11px] font-medium text-gray-400">Save</span>
            </button>
            </div>

        </div>
    </div>
</main>

<!-- SHARE POPUP -->
<div id="shareOverlay" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 opacity-0 pointer-events-none">
    <div id="shareBackdrop" class="absolute inset-0"></div>
    <div class="relative bg-[#141414] border border-[#2a2a2a] rounded-[18px] p-7 max-w-[90vw] w-[560px] shadow-2xl">
        <div class="flex items-center justify-between mb-6">
            <span class="font-serif text-2xl font-semibold italic text-yellow-500">Share</span>
            <button id="shareClose" class="w-8 h-8 rounded-full hover:bg-white/10 border-none text-white flex items-center justify-center cursor-pointer transition-colors bg-transparent text-base"><i class="fa-solid fa-xmark pointer-events-none"></i></button>
        </div>
        <!-- Friends -->
        <div class="flex items-center gap-2 mb-6">
            <button class="w-8 h-8 rounded-full bg-white/5 border border-[#333] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-xs flex-shrink-0"><i class="fa-solid fa-chevron-left pointer-events-none"></i></button>
            <div class="flex-1 flex items-start justify-center gap-6">
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-lg font-bold hover:opacity-80 transition-opacity" style="background:#c0392b">C</div>
                    <span class="text-[11px] text-gray-400">Charlie</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-lg font-bold hover:opacity-80 transition-opacity" style="background:#7c3aed">F</div>
                    <span class="text-[11px] text-gray-400">Frank</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-lg font-bold hover:opacity-80 transition-opacity" style="background:#9333ea">G</div>
                    <span class="text-[11px] text-gray-400">Grace</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-lg font-bold hover:opacity-80 transition-opacity" style="background:#16a34a">J</div>
                    <span class="text-[11px] text-gray-400">Jerry</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-lg font-bold hover:opacity-80 transition-opacity" style="background:#6b7280">Z</div>
                    <span class="text-[11px] text-gray-400">Zane</span>
                </button>
            </div>
            <button class="w-8 h-8 rounded-full bg-white/5 border border-[#333] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-xs flex-shrink-0"><i class="fa-solid fa-chevron-right pointer-events-none"></i></button>
        </div>
        <div class="h-px bg-[#2a2a2a] mb-5"></div>
        <!-- Platforms -->
        <div class="flex items-center gap-2 mb-6">
            <button class="w-8 h-8 rounded-full bg-white/5 border border-[#333] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-xs flex-shrink-0"><i class="fa-solid fa-chevron-left pointer-events-none"></i></button>
            <div class="flex-1 flex items-start justify-center gap-6">
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group"><div class="w-14 h-14 rounded-full bg-black border border-[#333] flex items-center justify-center text-white text-xl group-hover:opacity-80 transition-opacity"><i class="fa-brands fa-twitter pointer-events-none"></i></div><span class="text-[11px] text-gray-400">X/Twitter</span></button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group"><div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-xl group-hover:opacity-80 transition-opacity" style="background:#1877f2"><i class="fa-brands fa-facebook-f pointer-events-none"></i></div><span class="text-[11px] text-gray-400">Facebook</span></button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group"><div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-xl group-hover:opacity-80 transition-opacity" style="background:#25d366"><i class="fa-brands fa-whatsapp pointer-events-none"></i></div><span class="text-[11px] text-gray-400">Whatsapp</span></button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group"><div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-xl group-hover:opacity-80 transition-opacity" style="background:#6b7280"><i class="fa-solid fa-envelope pointer-events-none"></i></div><span class="text-[11px] text-gray-400">Mail</span></button>
                <button class="flex flex-col items-center gap-1.5 bg-transparent border-none cursor-pointer group"><div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-xl group-hover:opacity-80 transition-opacity" style="background:#ff4500"><i class="fa-brands fa-reddit-alien pointer-events-none"></i></div><span class="text-[11px] text-gray-400">Reddit</span></button>
            </div>
            <button class="w-8 h-8 rounded-full bg-white/5 border border-[#333] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-xs flex-shrink-0"><i class="fa-solid fa-chevron-right pointer-events-none"></i></button>
        </div>
        <!-- Copy link -->
        <div class="flex items-center gap-2.5 bg-[#1a1a1a] border border-[#333] rounded-xl px-3.5 py-2.5">
            <span id="shareUrl" class="flex-1 text-xs text-gray-500 truncate">https://cinesync.com/clips/</span>
            <button id="copyBtn" class="text-xs font-semibold text-gray-400 hover:text-white bg-transparent border-none cursor-pointer px-2 py-1 rounded-md hover:bg-white/5 whitespace-nowrap transition-colors">Copy</button>
        </div>
    </div>
</div>

<!-- SAVED TOAST -->
<div id="savedToast" class="fixed bottom-10 left-1/2 bg-[#141414] border border-[#2a2a2a] rounded-xl px-10 py-4 z-[80] pointer-events-none"
     style="opacity:0;transform:translateX(-50%) translateY(16px);">
    <p class="font-serif text-xl italic font-semibold text-yellow-500 whitespace-nowrap">Clip Saved!</p>
</div>

<script type="module">
import { renderSidebar } from '../js/components/sidebar.js';
import { renderHeader }  from '../js/components/header.js';
import { MOCK_CLIPS }    from '../js/services/clips-data.js';

renderSidebar('sidebar-container', 'trending-clips');
renderHeader('header-container');

// ── DATA ──────────────────────────────────────────────────────────────────────
const CLIPS = MOCK_CLIPS;

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentIdx  = 0;
let activePanel = null;
const savedSet  = new Set();
let toastTimer  = null;

// ── INIT: read ?id from URL ───────────────────────────────────────────────────
function getIdxFromURL() {
    const id  = new URLSearchParams(window.location.search).get('id');
    const idx = CLIPS.findIndex(c => c.id === id);
    return idx >= 0 ? idx : 0;
}

function loadClip(idx, push = true) {
    currentIdx = ((idx % CLIPS.length) + CLIPS.length) % CLIPS.length;
    const clip = CLIPS[currentIdx];

    if (push) history.pushState({id: clip.id}, '', `clip-viewer.html?id=${clip.id}`);
    document.title = `CineSync – ${clip.show.name}`;

    document.getElementById('clipThumb').className = `absolute inset-0 w-full h-full ${clip.gradientClass}`;

    const overlay = document.getElementById('clipCaptionOverlay');
    overlay.innerHTML = `
        <div class="space-y-2">
            <div class="flex flex-wrap gap-1">
                ${clip.tags.map(tag => `
                    <span class="text-xs text-yellow-400">
                        ${tag}
                    </span>
                `).join('')}
            </div>
            <p class="text-white text-sm leading-relaxed line-clamp-2" title="${clip.caption}">
                ${clip.caption}
            </p>
        </div>
    `;

    document.getElementById('commentCount').textContent = clip.commentCount ?? 0;

    closePanelImmediate();
    syncSaveIcon();
}

// ── PANEL ─────────────────────────────────────────────────────────────────────
function togglePanel(type) {
    activePanel === type ? closePanel() : (() => { activePanel = type; openPanel(type); })();
}

function openPanel(type) {
    const panel = document.getElementById('sidePanel');
    const main  = document.getElementById('clipMain');
    const clip  = CLIPS[currentIdx];

    const content = type === 'info' ? infoHTML(clip) : commentsHTML(clip);
    panel.innerHTML = content;
    panel.style.width = '300px';
    panel.style.opacity = '1';
    panel.style.display = 'flex';
    panel.style.flexDirection = 'column';
    panel.style.overflow = 'hidden';
    setActive(type);
}

function closePanel() {
    const panel = document.getElementById('sidePanel');
    const main  = document.getElementById('clipMain');
    panel.style.width = '0'; panel.style.opacity = '0'; panel.style.overflow = 'hidden';
    activePanel = null; setActive(null);
}

function closePanelImmediate() {
    const panel = document.getElementById('sidePanel');
    const main  = document.getElementById('clipMain');
    if (!panel) return;
    panel.style.transition = 'none';
    panel.style.width = '0'; panel.style.opacity = '0'; panel.style.overflow = 'hidden';
    requestAnimationFrame(() => { panel.style.transition = ''; });
    activePanel = null; setActive(null);
}

function setActive(a) {
    document.querySelectorAll('[data-action]').forEach(btn => {
        const icon = btn.querySelector('.action-icon');
        if (!icon) return;
        const on = btn.dataset.action === a;
        icon.style.background  = on ? 'rgba(234,179,8,0.15)' : '';
        icon.style.borderColor = on ? 'rgba(234,179,8,0.4)'  : '';
        icon.style.color       = on ? '#eab308' : '';
    });
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
function handleSave() {
    const id = CLIPS[currentIdx].id;
    savedSet.has(id) ? savedSet.delete(id) : (savedSet.add(id), showToast());
    syncSaveIcon();
}

function syncSaveIcon() {
    const saved = savedSet.has(CLIPS[currentIdx].id);
    document.getElementById('saveIcon').className =
        saved ? 'fa-solid fa-bookmark pointer-events-none' : 'fa-regular fa-bookmark pointer-events-none';
    const icon = document.querySelector('[data-action="save"] .action-icon');
    if (icon) { icon.style.background = saved?'rgba(234,179,8,0.15)':''; icon.style.borderColor = saved?'rgba(234,179,8,0.4)':''; icon.style.color = saved?'#eab308':''; }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast() {
    const t = document.getElementById('savedToast');
    if (toastTimer) clearTimeout(toastTimer);
    t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
    toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(16px)'; }, 2500);
}

// ── SHARE ─────────────────────────────────────────────────────────────────────
function openShare() {
    document.getElementById('shareUrl').textContent = `https://cinesync.com/clips/${CLIPS[currentIdx].id}`;
    const btn = document.getElementById('copyBtn'); btn.textContent = 'Copy'; btn.style.color = '';
    const o = document.getElementById('shareOverlay');
    o.style.opacity = '1'; o.style.pointerEvents = 'all';
}
function closeShare() {
    const o = document.getElementById('shareOverlay');
    o.style.opacity = '0'; o.style.pointerEvents = 'none';
}

document.getElementById('shareBackdrop').addEventListener('click', closeShare);
document.getElementById('shareClose').addEventListener('click', closeShare);
document.getElementById('copyBtn').addEventListener('click', () => {
    const btn = document.getElementById('copyBtn');
    navigator.clipboard?.writeText(document.getElementById('shareUrl').textContent.trim()).catch(()=>{});
    btn.textContent = 'Copied!'; btn.style.color = '#22c55e';
    setTimeout(() => { btn.textContent = 'Copy'; btn.style.color = ''; }, 2000);
});

// ── ACTION RAIL ───────────────────────────────────────────────────────────────
document.getElementById('actionRail').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]'); if (!btn) return;
    const a = btn.dataset.action;
    if (a === 'info')     togglePanel('info');
    if (a === 'comments') togglePanel('comments');
    if (a === 'share')    openShare();
    if (a === 'save')     handleSave();
});

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') loadClip(currentIdx + 1);
    if (e.key === 'ArrowUp')   loadClip(currentIdx - 1);
    if (e.key === 'Escape') {
        if (document.getElementById('shareOverlay').style.opacity === '1') closeShare();
    }
});

// ── BROWSER BACK/FORWARD ──────────────────────────────────────────────────────
window.addEventListener('popstate', () => loadClip(getIdxFromURL(), false));

// ── PANEL HTML ────────────────────────────────────────────────────────────────
function infoHTML(clip) {
    const genres = Array.isArray(clip.show.genres)
        ? clip.show.genres.join(' • ')
        : clip.show.genres;

    return `<div class="comments-list" style="padding: 32px 28px; height: 100%;">
        <!-- SOURCE -->

        <div class="mb-6">
            <p class="text-[11px] uppercase tracking-[0.2em] text-gray-600 mb-2">
                Source
            </p>

            <h2 class="font-serif text-2xl font-semibold text-yellow-500 mb-2">
                ${clip.show.name}
            </h2>

            <div class="
                inline-flex
                items-center
                gap-2
                bg-yellow-500/10
                border
                border-yellow-500/20
                text-yellow-400
                text-sm
                font-medium
                px-3
                py-1.5
                rounded-full
            ">
                <i class="fa-solid fa-star text-xs"></i>
                ${clip.show.rating}
            </div>

            <p class="text-xs text-gray-500 mt-3">
                ${genres}
            </p>
        </div>

        <div class="h-px bg-[#2a2a2a] mb-6"></div>

        <!-- ABOUT -->

        <div class="mb-6">
            <p class="text-[11px] uppercase tracking-[0.2em] text-gray-600 mb-3">
                About
            </p>

            <p class="text-sm text-gray-400 leading-relaxed">
                ${clip.show.description}
            </p>
        </div>

        <div class="h-px bg-[#2a2a2a] mb-6"></div>

        <!-- CLIP DETAILS -->

        <div class="mb-6">
            <p class="text-[11px] uppercase tracking-[0.2em] text-gray-600 mb-3">
                Clip
            </p>

            <div class="flex flex-wrap gap-2 mb-3">
                ${(clip.tags || []).map(tag => `
                    <span class="
                        text-xs
                        text-yellow-400
                        bg-yellow-500/10
                        px-2.5
                        py-1
                        rounded-full
                    ">
                        ${tag}
                    </span>
                `).join('')}
            </div>

            <p class="text-sm text-gray-400 leading-relaxed">
                ${clip.caption}
            </p>
        </div>

        <div class="h-px bg-[#2a2a2a] mb-6"></div>

        <!-- LINKS -->

        <div>
            <p class="text-[11px] uppercase tracking-[0.2em] text-gray-600 mb-3">
                External Links
            </p>

            <a href="${clip.youtubeUrl}"
               target="_blank"
               class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                View original clip
            </a>
        </div>
    </div>`;
}

function commentEl(c, reply = false) {
    return `
        <div style="display:flex;gap:10px;${reply?'margin-left:38px;margin-top:10px':'margin-bottom:16px'}">
            <div style="width:32px;height:32px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#9ca3af;flex-shrink:0;margin-top:2px">${c.initials}</div>
            <div style="flex:1;min-width:0">
                <p style="font-size:12px;font-weight:600;color:#d1d5db;margin:0 0 3px">${c.user}</p>
                <p style="font-size:13px;color:#9ca3af;line-height:1.5;margin:0">${c.text}</p>
                ${c.replyCount ? `<button style="font-size:11px;color:#6b7280;background:none;border:none;cursor:pointer;margin-top:5px;padding:0" onmouseover="this.style.color='#9ca3af'" onmouseout="this.style.color='#6b7280'">∨ ${c.replyCount} Reply</button>` : ''}
                ${(c.replies||[]).map(r => commentEl(r, true)).join('')}
            </div>
        </div>`;
}

function commentsHTML(clip) {
    const list = clip.comments ?? [];
    return `
        <div class="comments-panel">
            <div class="comments-header">
                <h2 class="text-xl font-bold text-white">Comments</h2>
            </div>
            
            <div class="comments-list">
                ${list.length ? list.map(c => commentEl(c)).join('') : '<p style="font-size:13px;color:#6b7280;font-style:italic">No comments yet.</p>'}
            </div>

            <div class="comments-input">
            <div style="display:flex; gap:12px; align-items: flex-start;">
                <div style="width:32px; height:32px; border-radius:50%; background:#eab308; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#000; flex-shrink:0;">ME</div>
                <div style="flex:1;">
