<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync – Sign Up</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/globals.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family:'Inter',sans-serif; background:#0d0d0d; color:#fff; }
        .font-serif { font-family:'Playfair Display',serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 dark">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="discover.html" class="inline-block transition-transform hover:scale-105">
                <h1 class="text-4xl font-serif font-bold italic tracking-wide text-white">CineSync</h1>
            </a>
            <p class="text-sm text-gray-500 mt-2">Create an account to save clips, build watchlists, and sync with friends.</p>
        </div>

        <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl p-8 shadow-2xl">
            <div id="errorBanner" class="hidden mb-5 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/30 text-sm text-red-400"></div>

            <form id="registerForm" class="space-y-4" novalidate>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2" for="displayName">Display Name</label>
                    <input type="text" id="displayName" required autocomplete="name"
                           class="w-full bg-[#1a1a1a] border border-[#333] text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block p-3 outline-none transition-colors placeholder-gray-500"
                           placeholder="Your name">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2" for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email"
                           class="w-full bg-[#1a1a1a] border border-[#333] text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block p-3 outline-none transition-colors placeholder-gray-500"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2" for="password">Password</label>
                    <input type="password" id="password" required autocomplete="new-password" minlength="6"
                           class="w-full bg-[#1a1a1a] border border-[#333] text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block p-3 outline-none transition-colors placeholder-gray-500"
                           placeholder="At least 6 characters">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6"
                           class="w-full bg-[#1a1a1a] border border-[#333] text-white text-sm rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block p-3 outline-none transition-colors placeholder-gray-500"
                           placeholder="••••••••">
                </div>
                <button type="submit" id="submitBtn"
                        class="w-full bg-yellow-500 hover:bg-yellow-400 disabled:opacity-60 disabled:cursor-not-allowed text-black font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <span id="submitLabel">Create Account</span>
                    <i id="submitSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </form>

            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-[#2a2a2a]"></div>
                <span class="text-xs text-gray-500 uppercase tracking-wider">or</span>
                <div class="flex-1 h-px bg-[#2a2a2a]"></div>
            </div>

            <button id="googleBtn" type="button"
                    class="w-full flex items-center justify-center gap-3 bg-[#1a1a1a] hover:bg-[#222] disabled:opacity-60 disabled:cursor-not-allowed border border-[#333] text-white text-sm font-semibold py-3 rounded-lg transition-colors">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? <a href="login.html" class="text-yellow-500 font-semibold hover:text-yellow-400 transition-colors">Log in</a>
        </p>
    </div>

    <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
