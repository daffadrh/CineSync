<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync – Trending Clips</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/globals.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family:'Inter',sans-serif; background:#0d0d0d; color:#fff; }
        .font-serif { font-family:'Playfair Display',serif; }
        ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-track{background:#121212}
        ::-webkit-scrollbar-thumb{background:#333;border-radius:4px} ::-webkit-scrollbar-thumb:hover{background:#555}
        .hide-scrollbar::-webkit-scrollbar{display:none} .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        .clip-grad-1 {background:linear-gradient(160deg,#3a2a1a,#c8922a)}
        .clip-grad-2 {background:linear-gradient(160deg,#1a2a3a,#2a8ac8)}
        .clip-grad-3 {background:linear-gradient(160deg,#2a1a3a,#8a2ac8)}
        .clip-grad-4 {background:linear-gradient(160deg,#1a3a2a,#2ac88a)}
        .clip-grad-5 {background:linear-gradient(160deg,#3a1a2a,#c82a6a)}
        .clip-grad-6 {background:linear-gradient(160deg,#2a2a1a,#c8c02a)}
        .clip-grad-7 {background:linear-gradient(160deg,#1a3a3a,#2ac8c0)}
        .clip-grad-8 {background:linear-gradient(160deg,#3a2a2a,#c84a2a)}
        .clip-grad-9 {background:linear-gradient(160deg,#2a1a1a,#c8402a)}
        .clip-grad-10{background:linear-gradient(160deg,#1a2a1a,#4ac82a)}
        .clips-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 220px)); gap:20px; }
        .clip-card .ctx-btn { opacity:0; transition:opacity .2s; }
        .clip-card:hover .ctx-btn { opacity:1; }
        .clip-card .clip-thumb { transition:border-color .2s; }
        .clip-card:hover .clip-thumb { border-color:#555 !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden dark">

<!-- SIDEBAR -->
<aside id="sidebar-container" class="bg-[#141414] border-r border-[#2a2a2a] flex flex-col h-full flex-shrink-0 z-20" style="width:240px;"></aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col h-full overflow-hidden">
    <div id="header-container" class="z-10 flex-shrink-0 w-full"></div>

    <div class="flex-1 overflow-y-auto p-8">
        <p class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-1.5">Discover moments in short form</p>
        <h2 class="font-serif text-4xl mb-10">Find what <span class="text-yellow-500 italic">other people</span> are watching.</h2>

        <section class="mb-12">
            <h3 class="text-xs font-bold uppercase tracking-widest text-white mb-5">Want to watch something <span class="text-yellow-500">NEW</span>?</h3>
            <div class="clips-grid" id="newClipsGrid"></div>
        </section>
        <section class="mb-12">
            <h3 class="text-xs font-bold uppercase tracking-widest text-white mb-5">Clips that are trending in your <span class="text-yellow-500">AREA</span></h3>
            <div class="clips-grid" id="areaClipsGrid"></div>
        </section>
        <section class="mb-12">
            <h3 class="text-xs font-bold uppercase tracking-widest text-white mb-5">Feeling <span class="text-yellow-500">NOSTALGIC</span>? Here are some clips that you have watched</h3>
            <div class="clips-grid" id="nostalgicClipsGrid"></div>
        </section>
    </div>
</main>

<script type="module" src="../js/pages/trending-clips.js"></script>
</body>
</html>
